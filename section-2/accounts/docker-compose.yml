services:
  accounts:
    image: "cdac/accounts:s4"
    container_name: accounts-ms
    restart: unless-stopped
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - cdacbank

  loans:
    image: "cdac/loans:s4"
    container_name: loans-ms
    restart: unless-stopped
    ports:
      - "8090:8090"
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - cdacbank

  cards:
    image: "cdac/cards:s4"
    container_name: cards-ms
    restart: unless-stopped
    ports:
      - "9000:9000"
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - cdacbank

networks:
  cdacbank:
    driver: bridge